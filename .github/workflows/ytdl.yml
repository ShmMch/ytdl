name: YouTube Browser Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      quality:
        description: 'Video Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 720p
          - 1080p

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver_manager yt-dlp requests
        sudo apt-get update
        sudo apt-get install -y firefox ffmpeg xvfb

    - name: Create browser script
      run: |
        cat > browser_handler.py << 'EOL'
        from selenium import webdriver
        from selenium.webdriver.firefox.service import Service
        from selenium.webdriver.firefox.options import Options
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        from selenium.webdriver.common.by import By
        import json
        import time
        import os

        def setup_driver():
            options = Options()
            options.add_argument('--headless')
            options.add_argument('--no-sandbox')
            options.add_argument('--disable-dev-shm-usage')
            options.set_preference("media.volume_scale", "0.0")
            
            service = Service()
            driver = webdriver.Firefox(
                options=options,
                service=service
            )
            return driver

        def get_cookies(url):
            driver = setup_driver()
            try:
                print("Opening YouTube...")
                driver.get("https://www.youtube.com")
                time.sleep(5)  # Let the page load
                
                print("Getting cookies...")
                cookies = driver.get_cookies()
                
                # Convert cookies to yt-dlp format
                cookie_string = ""
                for cookie in cookies:
                    cookie_string += f"{cookie['domain']}\tTRUE\t{cookie['path']}\t"
                    cookie_string += f"{'TRUE' if cookie.get('secure', False) else 'FALSE'}\t"
                    cookie_string += f"{cookie.get('expiry', 0)}\t{cookie['name']}\t{cookie['value']}\n"
                
                with open('cookies.txt', 'w', encoding='utf-8') as f:
                    f.write(cookie_string)
                
                print(f"Saved {len(cookies)} cookies")
                return True
                
            except Exception as e:
                print(f"Error getting cookies: {str(e)}")
                return False
            finally:
                driver.quit()

        if __name__ == "__main__":
            success = get_cookies("https://www.youtube.com")
            if not success:
                exit(1)
        EOL

    - name: Create download script
      run: |
        cat > download.py << 'EOL'
        import yt_dlp
        import sys
        import os
        import json
        from datetime import datetime

        def download_video(url, quality='best'):
            timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
            output_template = f'downloads/%(title)s_{timestamp}.%(ext)s'
            
            if quality == 'best':
                format_str = 'bestvideo+bestaudio/best'
            else:
                format_str = f'bestvideo[height<={quality[:-1]}]+bestaudio/best[height<={quality[:-1]}]'

            ydl_opts = {
                'format': format_str,
                'outtmpl': output_template,
                'cookiefile': 'cookies.txt',
                'merge_output_format': 'mp4',
                'postprocessors': [{
                    'key': 'FFmpegVideoConvertor',
                    'preferedformat': 'mp4',
                }],
                'verbose': True,
                'progress_hooks': [progress_hook],
                'http_headers': {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                    'Accept-Language': 'en-US,en;q=0.5',
                    'Upgrade-Insecure-Requests': '1'
                }
            }

            try:
                os.makedirs('downloads', exist_ok=True)
                
                with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                    print(f"Starting download of {url}")
                    info = ydl.extract_info(url, download=False)
                    
                    if info:
                        print(f"Title: {info.get('title', 'Unknown')}")
                        print(f"Duration: {info.get('duration', 'Unknown')}s")
                        
                        # Save format info
                        formats = [{
                            'format_id': f.get('format_id'),
                            'ext': f.get('ext'),
                            'resolution': f.get('format_note'),
                            'filesize': f.get('filesize'),
                            'vcodec': f.get('vcodec'),
                            'acodec': f.get('acodec')
                        } for f in info.get('formats', [])]
                        
                        with open('formats.json', 'w') as f:
                            json.dump(formats, f, indent=2)
                        
                        ydl.download([url])
                        return True
                    return False
                    
            except Exception as e:
                print(f"Error: {str(e)}")
                return False

        def progress_hook(d):
            if d['status'] == 'downloading':
                try:
                    if 'total_bytes' in d:
                        downloaded = d.get('downloaded_bytes', 0)
                        total = d['total_bytes']
                        percentage = (downloaded / total) * 100
                        print(f"Progress: {percentage:.1f}%")
                    elif 'downloaded_bytes' in d:
                        mb = d['downloaded_bytes'] / 1024 / 1024
                        print(f"Downloaded: {mb:.1f}MB")
                except:
                    pass
            elif d['status'] == 'finished':
                print(f"Finished downloading: {d['filename']}")
            elif d['status'] == 'error':
                print(f"Error: {d.get('error_message', 'Unknown error')}")

        if __name__ == "__main__":
            if len(sys.argv) < 2:
                print("Usage: python download.py <url> [quality]")
                sys.exit(1)
                
            url = sys.argv[1]
            quality = sys.argv[2] if len(sys.argv) > 2 else 'best'
            
            success = download_video(url, quality)
            if not success:
                sys.exit(1)
        EOL

    - name: Setup virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        echo "export DISPLAY=:99" >> $GITHUB_ENV

    - name: Get cookies
      run: |
        python browser_handler.py

    - name: Run download
      run: |
        python download.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.quality }}"

    - name: Upload video
      uses: actions/upload-artifact@v4.3.1
      with:
        name: downloaded-video
        path: downloads/*
        retention-days: 5
        compression-level: 0
        overwrite: true

    - name: Upload format info
      uses: actions/upload-artifact@v4.3.1
      with:
        name: format-info
        path: formats.json
        retention-days: 5
