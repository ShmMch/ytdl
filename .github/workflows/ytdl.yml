name: YouTube Browser Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      quality:
        description: 'Video Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 720p
          - 1080p

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb ffmpeg
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install ./google-chrome-stable_current_amd64.deb
        python -m pip install --upgrade pip
        pip install selenium undetected-chromedriver yt-dlp requests

    - name: Create browser script
      run: |
        cat > browser_handler.py << 'EOL'
        import undetected_chromedriver as uc
        from selenium.webdriver.common.by import By
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        import time
        import os
        import json

        def get_cookies():
            options = uc.ChromeOptions()
            options.add_argument('--no-sandbox')
            options.add_argument('--headless=new')
            options.add_argument('--disable-dev-shm-usage')
            options.add_argument("--window-size=1920,1080")
            options.add_argument('--start-maximized')
            
            try:
                print("Starting undetected-chromedriver...")
                driver = uc.Chrome(
                    options=options,
                    version_main=120  # Specify Chrome version
                )
                
                print("Opening YouTube...")
                driver.get('https://www.youtube.com')
                time.sleep(5)  # Let page load fully
                
                print("Getting cookies...")
                cookies = driver.get_cookies()
                
                print("Converting cookies...")
                # Write cookies in Netscape format
                with open('cookies.txt', 'w', encoding='utf-8') as f:
                    f.write('# Netscape HTTP Cookie File\n')
                    f.write('# https://curl.haxx.se/rfc/cookie_spec.html\n')
                    f.write('# This is a generated file!  Do not edit.\n\n')
                    
                    for cookie in cookies:
                        secure = str(cookie.get('secure', False)).upper()
                        domain = cookie.get('domain', '')
                        if not domain.startswith('.'):
                            domain = '.' + domain.lstrip('.')
                            
                        expiry = cookie.get('expiry', int(time.time() + 3600*24*365))
                        
                        f.write(f"{domain}\t")
                        f.write("TRUE\t")  # Include subdomains
                        f.write(f"{cookie.get('path', '/')}\t")
                        f.write(f"{secure}\t")
                        f.write(f"{expiry}\t")
                        f.write(f"{cookie.get('name')}\t")
                        f.write(f"{cookie.get('value')}\n")
                
                print(f"Saved {len(cookies)} cookies")
                return True
                
            except Exception as e:
                print(f"Error in getting cookies: {str(e)}")
                if 'driver' in locals():
                    print("Page source:", driver.page_source[:500])
                return False
                
            finally:
                if 'driver' in locals():
                    try:
                        driver.quit()
                    except:
                        pass

        if __name__ == "__main__":
            success = False
            for attempt in range(3):
                print(f"\nAttempt {attempt + 1} of 3")
                if get_cookies():
                    success = True
                    break
                time.sleep(5)
            
            if not success:
                print("Failed to get cookies after all attempts")
                exit(1)
        EOL

    - name: Create download script
      run: |
        cat > download.py << 'EOL'
        import yt_dlp
        import sys
        import os
        import json
        from datetime import datetime

        def download_video(url, quality='best'):
            try:
                ydl_opts = {
                    'format': 'best' if quality == 'best' else f'bestvideo[height<={quality[:-1]}]+bestaudio/best',
                    'outtmpl': 'downloads/%(title)s.%(ext)s',
                    'cookiefile': 'cookies.txt',
                    'no_warnings': False,
                    'verbose': True,
                    'merge_output_format': 'mp4',
                    'postprocessors': [{
                        'key': 'FFmpegVideoConvertor',
                        'preferedformat': 'mp4',
                    }],
                    'http_headers': {
                        'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                        'Accept-Language': 'en-US,en;q=0.9',
                        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    }
                }

                os.makedirs('downloads', exist_ok=True)
                
                print(f"Starting download of {url}")
                print(f"Using options: {json.dumps(ydl_opts, indent=2)}")
                
                with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                    print("Extracting video info...")
                    info = ydl.extract_info(url, download=False)
                    
                    if info:
                        print(f"Video information retrieved successfully")
                        print(f"Title: {info.get('title', 'Unknown')}")
                        print(f"Duration: {info.get('duration', 'Unknown')} seconds")
                        
                        # Save format information
                        if 'formats' in info:
                            formats = [{
                                'format_id': f.get('format_id'),
                                'ext': f.get('ext'),
                                'resolution': f.get('format_note'),
                                'filesize': f.get('filesize'),
                                'vcodec': f.get('vcodec'),
                                'acodec': f.get('acodec')
                            } for f in info['formats']]
                            
                            with open('formats.json', 'w') as f:
                                json.dump(formats, f, indent=2)
                        
                        print("Starting actual download...")
                        ydl.download([url])
                        return True
                    else:
                        print("No video information retrieved")
                        return False
                    
            except yt_dlp.utils.DownloadError as e:
                print(f"Download error: {str(e)}")
                return False
            except Exception as e:
                print(f"Unexpected error: {str(e)}")
                print(f"Error type: {type(e)}")
                return False

        def main():
            if len(sys.argv) < 2:
                print("Usage: python download.py <url> [quality]")
                sys.exit(1)
                
            url = sys.argv[1]
            quality = sys.argv[2] if len(sys.argv) > 2 else 'best'
            
            print(f"URL: {url}")
            print(f"Quality: {quality}")
            
            success = download_video(url, quality)
            if not success:
                sys.exit(1)

        if __name__ == "__main__":
            main()
        EOL

    - name: Setup virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        echo "export DISPLAY=:99" >> $GITHUB_ENV

    - name: Get cookies
      env:
        DISPLAY: :99
      run: |
        python browser_handler.py

    - name: Run download
      run: |
        python download.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.quality }}"

    - name: Upload video
      uses: actions/upload-artifact@v4.3.1
      with:
        name: downloaded-video
        path: downloads/*
        retention-days: 5
        compression-level: 0
        overwrite: true

    - name: Upload format info
      uses: actions/upload-artifact@v4.3.1
      with:
        name: format-info
        path: formats.json
        retention-days: 5
