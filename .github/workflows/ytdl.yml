name: YouTube Download with Cookies

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      cookies_content:
        description: 'Content of cookies.txt (base64 encoded)'
        required: true
        type: string
      audio_only:
        description: 'Download only audio'
        required: false
        default: false
        type: boolean

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Create cookies file
      run: |
        echo "${{ inputs.cookies_content }}" | base64 -d > cookies.txt
        echo "Created cookies.txt file"
        echo "First line of cookies file:"
        head -n 1 cookies.txt

    - name: Create download script
      run: |
        cat > download.py << 'EOL'
        import yt_dlp
        import sys
        import os
        import logging

        logging.basicConfig(
            level=logging.INFO,
            format='%(asctime)s - %(levelname)s - %(message)s'
        )
        logger = logging.getLogger(__name__)

        def download_video(url, audio_only=False):
            try:
                os.makedirs('downloads', exist_ok=True)
                
                ydl_opts = {
                    'format': 'bestaudio[ext=m4a]/best' if audio_only else 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4',
                    'outtmpl': 'downloads/%(title)s.%(ext)s',
                    'cookiefile': 'cookies.txt',
                    'postprocessors': [{
                        'key': 'FFmpegExtractAudio',
                        'preferredcodec': 'mp3',
                        'preferredquality': '192',
                    }] if audio_only else [],
                    'verbose': True,
                    'progress_hooks': [progress_hook]
                }

                logger.info(f"Starting download: {url}")
                logger.info(f"Audio only: {audio_only}")
                
                with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                    logger.info("Getting video information...")
                    info = ydl.extract_info(url, download=False)
                    
                    if info:
                        logger.info(f"Title: {info.get('title', 'Unknown')}")
                        logger.info(f"Duration: {info.get('duration', 'Unknown')} seconds")
                        
                        logger.info("Starting download...")
                        ydl.download([url])
                        return True
                        
                    logger.error("Could not get video information")
                    return False
                    
            except Exception as e:
                logger.error(f"Download error: {str(e)}")
                return False

        def progress_hook(d):
            if d['status'] == 'downloading':
                try:
                    if 'total_bytes' in d:
                        downloaded = d.get('downloaded_bytes', 0)
                        total = d['total_bytes']
                        percentage = (downloaded / total) * 100
                        logger.info(f"Download progress: {percentage:.1f}%")
                    elif 'downloaded_bytes' in d:
                        mb = d['downloaded_bytes'] / 1024 / 1024
                        logger.info(f"Downloaded: {mb:.1f} MB")
                except:
                    pass
            elif d['status'] == 'finished':
                logger.info(f"Download finished: {d['filename']}")
            elif d['status'] == 'error':
                logger.error(f"Error downloading: {d.get('error_message', 'Unknown error')}")

        if __name__ == "__main__":
            if len(sys.argv) < 2:
                print("Usage: python download.py <url> [--audio]")
                sys.exit(1)
                
            url = sys.argv[1]
            audio_only = '--audio' in sys.argv[2:]
            
            if not os.path.exists('cookies.txt'):
                logger.error("cookies.txt file not found!")
                sys.exit(1)
                
            if not download_video(url, audio_only):
                sys.exit(1)
        EOL

    - name: Run download
      run: |
        python download.py "${{ github.event.inputs.video_url }}" ${{ github.event.inputs.audio_only == 'true' && '--audio' || '' }}

    - name: Upload downloads
      uses: actions/upload-artifact@v4.3.1
      with:
        name: downloads
        path: downloads/*
        retention-days: 5
        compression-level: 0
        overwrite: true
