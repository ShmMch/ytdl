# .github/workflows/transcribe.yml

name: YouTube Transcription

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      language:
        description: 'Language Code (e.g., he-IL)'
        default: 'he-IL'
        required: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour timeout

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Create requirements.txt
      run: |
        echo "yt-dlp==2023.12.30" >> requirements.txt
        echo "SpeechRecognition==3.10.0" >> requirements.txt
        echo "pydub==0.25.1" >> requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create directories
      run: |
        mkdir -p downloads/temp

    - name: Run transcription
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        LANGUAGE: ${{ github.event.inputs.language }}
      run: |
        python youtube_transcriber.py "$VIDEO_URL" "$LANGUAGE"

    - name: Upload transcript
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: transcript
        path: |
          downloads/*.txt
          youtube_transcription.log
        if-no-files-found: error
