name: YouTube Browser Download

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      quality:
        description: 'Video Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 720p
          - 1080p

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb ffmpeg
        python -m pip install --upgrade pip
        pip install youtube-dl yt-dlp

    - name: Create download script
      run: |
        cat > download.py << 'EOL'
        import yt_dlp
        import youtube_dl
        import sys
        import os
        import json
        from datetime import datetime

        def try_youtube_dl(url, quality='best'):
            print("Attempting download with youtube-dl...")
            ydl_opts = {
                'format': 'best',
                'outtmpl': 'downloads/%(title)s.%(ext)s',
                'no_warnings': False,
                'verbose': True,
                'extract_flat': True,
                'quiet': False,
                'http_headers': {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36',
                }
            }
            try:
                with youtube_dl.YoutubeDL(ydl_opts) as ydl:
                    info = ydl.extract_info(url, download=False)
                    if info:
                        print("Info retrieved successfully with youtube-dl")
                        return True, info
            except Exception as e:
                print(f"youtube-dl error: {str(e)}")
                return False, None
            return False, None

        def try_yt_dlp(url, quality='best'):
            print("Attempting download with yt-dlp...")
            ydl_opts = {
                'format': 'best' if quality == 'best' else f'bestvideo[height<={quality[:-1]}]+bestaudio/best',
                'outtmpl': 'downloads/%(title)s.%(ext)s',
                'no_warnings': False,
                'verbose': True,
                'extract_flat': True,
                'quiet': False,
                'extractor_args': {
                    'youtube': {
                        'skip': ['dash', 'hls'],
                        'player_skip': ['js', 'configs', 'webpage']
                    }
                },
                'http_headers': {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36',
                    'Accept-Language': 'en-US,en;q=0.9',
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                }
            }

            try:
                with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                    info = ydl.extract_info(url, download=False)
                    if info:
                        print("Info retrieved successfully with yt-dlp")
                        return True, info
            except Exception as e:
                print(f"yt-dlp error: {str(e)}")
                return False, None
            return False, None

        def download_video(url, quality='best'):
            os.makedirs('downloads', exist_ok=True)
            
            # Try youtube-dl first
            success, info = try_youtube_dl(url, quality)
            if not success:
                # If youtube-dl fails, try yt-dlp
                success, info = try_yt_dlp(url, quality)
                if not success:
                    return False

            if info:
                print(f"Video Title: {info.get('title', 'Unknown')}")
                
                # Determine format string based on quality
                if quality == 'best':
                    format_str = 'bestvideo+bestaudio/best'
                else:
                    format_str = f'bestvideo[height<={quality[:-1]}]+bestaudio/best[height<={quality[:-1]}]'

                final_opts = {
                    'format': format_str,
                    'outtmpl': 'downloads/%(title)s.%(ext)s',
                    'merge_output_format': 'mp4',
                    'postprocessors': [{
                        'key': 'FFmpegVideoConvertor',
                        'preferedformat': 'mp4',
                    }],
                    'verbose': True,
                    'progress_hooks': [lambda d: print(f"Download progress: {d.get('_percent_str', 'unknown')}")]
                }

                try:
                    with yt_dlp.YoutubeDL(final_opts) as ydl:
                        ydl.download([url])
                    return True
                except Exception as e:
                    print(f"Download error: {str(e)}")
                    return False

            return False

        def main():
            if len(sys.argv) < 2:
                print("Usage: python download.py <url> [quality]")
                sys.exit(1)
                
            url = sys.argv[1]
            quality = sys.argv[2] if len(sys.argv) > 2 else 'best'
            
            print(f"URL: {url}")
            print(f"Quality: {quality}")
            
            success = download_video(url, quality)
            if not success:
                sys.exit(1)

        if __name__ == "__main__":
            main()
        EOL

    - name: Run download
      run: |
        python download.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.quality }}"

    - name: Upload video
      uses: actions/upload-artifact@v4.3.1
      with:
        name: downloaded-video
        path: downloads/*
        retention-days: 5
        compression-level: 0
        overwrite: true
