name: YouTube Transcription

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      language:
        description: 'Language Code (e.g., he-IL)'
        default: 'he-IL'
        required: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour timeout

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg ca-certificates
        sudo update-ca-certificates
        ffmpeg -version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip certifi
        pip install yt-dlp==2023.12.30 SpeechRecognition==3.10.0 pydub==0.25.1
        python -m pip install --upgrade yt-dlp
        yt-dlp --version

    - name: Update certificates
      run: |
        python -m pip install --upgrade certifi
        echo "Python SSL certificate paths:"
        python -c "import ssl; print(ssl.get_default_verify_paths())"

    - name: Create directories
      run: |
        mkdir -p downloads/temp
        ls -la downloads

    - name: Run transcription
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        LANGUAGE: ${{ github.event.inputs.language }}
        PYTHONHTTPSVERIFY: "0"  # Disable SSL verification if needed
      run: |
        echo "Starting transcription process..."
        echo "Python version:"
        python --version
        echo "Working directory:"
        pwd
        echo "Directory contents:"
        ls -la
        python youtube_transcriber.py "$VIDEO_URL" "$LANGUAGE"

    - name: Check for output files
      if: always()
      run: |
        echo "Content of downloads directory:"
        ls -la downloads/
        echo "Content of temp directory:"
        ls -la downloads/temp/
        echo "Log file contents:"
        cat youtube_transcription.log || echo "No log file found"

    - name: Upload transcript
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: transcript
        path: |
          downloads/*.txt
          youtube_transcription.log
        if-no-files-found: error